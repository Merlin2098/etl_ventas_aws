# Fuente única de verdad para lo que varía por división de RetailCorp
# (SPEC-002 / SPEC-007). Editar aquí en vez de hardcodear en src/generators/.
#
# format: uno de csv | excel | json | pdf (mapeado a un writer en divisions.py)
# date_format: patrón strftime, o el literal "iso8601" / "free_text_es"
#   (ver src/generators/common.py:format_date_free_text para "free_text_es")
# ext: extensión del archivo generado
# categories: catálogo de categoría -> productos + rango de precio (price_min/price_max)

divisions:
  electronica:
    format: csv
    date_format: "%d/%m/%Y"
    ext: csv
    categories:
      Audio:
        products: ["Audífonos Bluetooth", "Parlante Portátil", "Barra de Sonido"]
        price_min: 15
        price_max: 300
      Computación:
        products: ["Laptop 14''", "Mouse Inalámbrico", "Teclado Mecánico"]
        price_min: 20
        price_max: 1200
      Telefonía:
        products: ["Smartphone Gama Media", "Funda Protectora", "Cargador Rápido"]
        price_min: 10
        price_max: 900

  supermercado:
    format: excel
    date_format: "%m-%d-%Y"
    ext: xlsx
    categories:
      Almacén:
        products: ["Arroz 1kg", "Aceite de Girasol", "Fideos Largos"]
        price_min: 1
        price_max: 8
      Lácteos:
        products: ["Leche Entera 1L", "Yogur Natural", "Queso Fresco"]
        price_min: 1
        price_max: 12
      Bebidas:
        products: ["Agua Mineral 500ml", "Gaseosa Cola 2L", "Jugo de Naranja"]
        price_min: 1
        price_max: 10

  moda:
    format: json
    date_format: iso8601
    ext: json
    categories:
      Calzado:
        products: ["Zapatillas Urbanas", "Botas de Cuero", "Sandalias"]
        price_min: 20
        price_max: 150
      Ropa:
        products: ["Polera Básica", "Jean Slim Fit", "Chaqueta de Invierno"]
        price_min: 10
        price_max: 120
      Accesorios:
        products: ["Gorra", "Cinturón de Cuero", "Bufanda"]
        price_min: 5
        price_max: 60

  marketplace:
    format: pdf
    date_format: free_text_es
    ext: pdf
    categories:
      Deportes:
        products: ["Balón de Fútbol", "Bicicleta Urbana", "Mancuernas 5kg"]
        price_min: 10
        price_max: 400
      Juguetería:
        products: ["Set de Bloques", "Muñeca Articulada", "Auto a Control Remoto"]
        price_min: 5
        price_max: 80
      Mascotas:
        products: ["Alimento para Perro 3kg", "Correa Ajustable", "Cama para Gato"]
        price_min: 5
        price_max: 70

# Orden en que --division all procesa las 4 divisiones (SPEC-002/SPEC-007).
division_order:
  - electronica
  - supermercado
  - moda
  - marketplace
